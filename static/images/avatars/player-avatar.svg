<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGold" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a1b7a"/>
      <stop offset="100%" stop-color="#2a0d4a"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b8"/>
      <stop offset="100%" stop-color="#f3a25c"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b2a86"/>
      <stop offset="100%" stop-color="#3a1466"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="80" r="78" fill="url(#bgGold)"/>

  <!-- hair back -->
  <path d="M28 88 Q30 30 80 26 Q130 30 132 88 L132 78 Q80 50 28 78 Z" fill="url(#hairGrad)" stroke="#fdf6ff" stroke-width="4"/>

  <!-- face -->
  <circle cx="80" cy="86" r="42" fill="url(#skinGrad)" stroke="#fdf6ff" stroke-width="4"/>

  <!-- cheeks -->
  <circle cx="60" cy="96" r="7" fill="#ff8a3d" opacity="0.5"/>
  <circle cx="100" cy="96" r="7" fill="#ff8a3d" opacity="0.5"/>

  <!-- eyes -->
  <circle cx="64" cy="84" r="5.5" fill="#2a0d4a"/>
  <circle cx="96" cy="84" r="5.5" fill="#2a0d4a"/>
  <circle cx="66" cy="82" r="1.8" fill="#fff"/>
  <circle cx="98" cy="82" r="1.8" fill="#fff"/>

  <!-- smile -->
  <path d="M66 100 Q80 112 94 100" stroke="#a3401f" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hair fringe -->
  <path d="M40 66 Q80 34 120 66 Q118 50 80 44 Q42 50 40 66 Z" fill="url(#hairGrad)" stroke="#fdf6ff" stroke-width="4"/>

  <!-- gold star accent (stationery sparkle) -->
  <path d="M124 34 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 z" fill="#ffd166" stroke="#fdf6ff" stroke-width="2"/>
</svg>